name: Online Boutique QA Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  KUBECTL_VERSION: "1.30.4"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black
      - name: Check formatting (black)
        run: black --check tests/ || echo "Format issues found"
      - name: Lint (flake8)
        run: flake8 tests/ || echo "Lint issues found"

  full-e2e-tests:
    name: Full K8s E2E Tests
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - name: Checkout QA code
        uses: actions/checkout@v4

      - name: Checkout microservices-demo (for K8s manifests)
        uses: actions/checkout@v4
        with:
          repository: GoogleCloudPlatform/microservices-demo
          path: microservices-demo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Kind (Kubernetes in Docker) cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: boutique-ci
          version: v0.20.0

      - name: Verify cluster is running
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy Online Boutique to Kind cluster
        run: |
          echo "Fixing placeholder image names in manifests..."
          cd microservices-demo/kubernetes-manifests
          
          sed -i 's|image: adservice$|image: gcr.io/google-samples/microservices-demo/adservice:v0.10.0|g' adservice.yaml
          sed -i 's|image: cartservice$|image: gcr.io/google-samples/microservices-demo/cartservice:v0.10.0|g' cartservice.yaml
          sed -i 's|image: checkoutservice$|image: gcr.io/google-samples/microservices-demo/checkoutservice:v0.10.0|g' checkoutservice.yaml
          sed -i 's|image: currencyservice$|image: gcr.io/google-samples/microservices-demo/currencyservice:v0.10.0|g' currencyservice.yaml
          sed -i 's|image: emailservice$|image: gcr.io/google-samples/microservices-demo/emailservice:v0.10.0|g' emailservice.yaml
          sed -i 's|image: frontend$|image: gcr.io/google-samples/microservices-demo/frontend:v0.10.0|g' frontend.yaml
          sed -i 's|image: loadgenerator$|image: gcr.io/google-samples/microservices-demo/loadgenerator:v0.10.0|g' loadgenerator.yaml
          sed -i 's|image: paymentservice$|image: gcr.io/google-samples/microservices-demo/paymentservice:v0.10.0|g' paymentservice.yaml
          sed -i 's|image: productcatalogservice$|image: gcr.io/google-samples/microservices-demo/productcatalogservice:v0.10.0|g' productcatalogservice.yaml
          sed -i 's|image: recommendationservice$|image: gcr.io/google-samples/microservices-demo/recommendationservice:v0.10.0|g' recommendationservice.yaml
          sed -i 's|image: shippingservice$|image: gcr.io/google-samples/microservices-demo/shippingservice:v0.10.0|g' shippingservice.yaml
          
          cd ../..
          
          rm -f microservices-demo/kubernetes-manifests/kustomization.yaml
          
          echo "Deploying application..."
          kubectl apply -f microservices-demo/kubernetes-manifests/
          
          echo "Waiting for all pods to be Ready (timeout 5m)..."
          kubectl wait --for=condition=ready pods --all --timeout=300s || (kubectl get pods && kubectl describe pods && exit 1)
          
          echo "Application is up and running!"
          kubectl get pods

      - name: Run all tests with Allure reporting
        run: |
          echo "Running full test suite..."
          pytest tests/ -v --alluredir=allure-results || TEST_FAILED=true
          
          if [ "$TEST_FAILED" = true ]; then
            echo "Some tests failed. Check Allure report for details."
            exit 1
          fi

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

  allure-report:
    name: Publish Allure Report
    runs-on: ubuntu-22.04
    needs: full-e2e-tests
    if: always()
    steps:
      - name: Download allure-results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Install Allure CLI
        run: |
          wget -qO- https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.tgz | tar -xz
          sudo mv allure-2.25.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Generate Allure Report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
