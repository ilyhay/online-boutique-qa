name: Online Boutique QA Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  KUBECTL_VERSION: "1.30.4"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black
      - name: Check formatting (black)
        run: black --check tests/
      - name: Lint (flake8)
        run: flake8 tests/

  infra-tests:
    name: Infrastructure Tests
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - name: Checkout microservices-demo (source manifests)
        uses: actions/checkout@v5
        with:
          repository: GoogleCloudPlatform/microservices-demo
          path: microservices-demo-ref
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare manifests path
        run: |
          mkdir -p $HOME/microservices-demo
          ln -s "$GITHUB_WORKSPACE/microservices-demo-ref/kubernetes-manifests" \
                "$HOME/microservices-demo/kubernetes-manifests"
      - name: Run Infrastructure tests with Allure
        run: |
          pytest tests/infra/ -v --alluredir=allure-results --clean-alluredir
        continue-on-error: true
      - name: Upload allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

  grpc-codegen:
    name: gRPC Code Generation Check
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Regenerate gRPC code
        run: |
          mkdir -p generated
          python -m grpc_tools.protoc \
            -I./protos \
            --python_out=./generated \
            --grpc_python_out=./generated \
            ./protos/demo.proto
      - name: Verify generated files exist
        run: |
          test -f generated/demo_pb2.py
          test -f generated/demo_pb2_grpc.py
          echo "gRPC code generated successfully"

  allure-report:
    name: Publish Allure Report
    runs-on: ubuntu-22.04
    needs: [infra-tests, grpc-codegen]
    if: always()
    steps:
      - name: Download allure-results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Publish Allure Report to GitHub Pages
        uses: simple-elf/allure-report-action@v1.13
        with:
          allure_results: allure-results
          allure_history: allure-history
          allure_report: allure-report
          gh_pages: gh-pages

  k8s-integration-tests:
    name: Full K8s Integration Tests
    runs-on: ubuntu-22.04
    needs: [infra-tests, grpc-codegen]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - name: Configure Kubernetes credentials
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
      - name: Run all K8s tests
        run: pytest tests/ -v --tb=short -s --alluredir=allure-results
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-full
          path: allure-results/
