name: Online Boutique QA Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  KUBECTL_VERSION: "1.30.4"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black
      - name: Check formatting (black)
        run: black --check tests/ || echo "⚠️ Format issues found (run 'black tests/' locally)"
      - name: Lint (flake8)
        run: flake8 tests/ || echo "⚠️ Lint issues found"

  infra-tests:
    name: Infrastructure Tests
    runs-on: ubuntu-22.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Checkout microservices-demo (source manifests)
        uses: actions/checkout@v4
        with:
          repository: GoogleCloudPlatform/microservices-demo
          path: microservices-demo-ref
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare manifests path
        run: |
          mkdir -p $HOME/microservices-demo
          ln -s "$GITHUB_WORKSPACE/microservices-demo-ref/kubernetes-manifests" \
                "$HOME/microservices-demo/kubernetes-manifests"
      - name: Run Infrastructure tests with Allure
        run: |
          mkdir -p allure-results
          # Запускаем тесты и сохраняем результаты. 
          # || true гарантирует, что шаг не упадет, если тесты не пройдут, и отчет все равно сгенерируется.
          pytest tests/infra/ -v --alluredir=allure-results || true
      - name: Upload allure-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

  allure-report:
    name: Generate and Publish Allure Report
    runs-on: ubuntu-22.04
    needs: infra-tests
    if: always()
    steps:
      - name: Download allure-results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Install Allure CLI
        run: |
          wget -qO- https://github.com/allure-framework/allure2/releases/download/2.25.0/allure-2.25.0.tgz | tar -xz
          sudo mv allure-2.25.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Generate Allure Report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
